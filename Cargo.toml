[package]
name = "fix-rs"
version = "0.1.0"
edition = "2024"
build = "build/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Clippy lint configuration (package-wide, all targets). correctness = deny (these
# are real bugs — fail the lint), the other default groups = warn. Together these
# five groups are clippy::all; they're disjoint (each lint is in exactly one group),
# so listing them needs no `priority`. pedantic/nursery/cargo/restriction stay at
# their default (allow) — opt in later if wanted.
[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[dependencies]
roxmltree = "0.21.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["filter-by-regex", "serde"] }
indexmap = "2.14.0"
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.4"
getset = "0.1.7"
derive_builder = "0.20.2"
log = "0.4.33"
env_logger = "0.11.11"

[build-dependencies]
roxmltree = "0.21.1"
handlebars = "6.4.3"
serde = { version = "1.0", features = ["derive"] }
heck = "0.5.0"

[dev-dependencies]
lazy_static = "1.5.0"
assert_matches = "1.5.0"
