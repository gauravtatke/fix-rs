# Initiator test config: fix-rs dials the QFJ `executor` acceptor (FIX.4.3, port 9879).
# Executor's session is EXEC->BANZAI, so we present the mirror: sender=BANZAI, target=EXEC.
# reset_on_logon = true makes the initiator reset its sequence to 1 and send
# ResetSeqNumFlag(141=Y) each logon (see task 8.7), so the executor resets too and
# reconnects start clean at seq 1 — no need to wipe the executor's store between runs.
# The previous acceptor config is preserved in git history (restore it to run as acceptor).
[Default]
begin_string = "FIX.4.3"
data_dictionary = "resources/FIX43.xml"

[[Session]]
connection_type = "initiator"
sender_comp_id = "BANZAI"
target_comp_id = "EXEC"
socket_connect_host = "127.0.0.1"
socket_connect_port = 9879
heartbeat_interval = 5
reset_on_logon = true
reconnect_interval = 5
